<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthy Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --main-grad: linear-gradient(115deg, #fbf6ed 0%, #e0f7fa 100%);
      --accent: #00bcd4;
      --water: #4bcffa;
      --sleep: #8e99f3;
      --move: #f9c846;
      --grat: #ffab91;
      --success: #81c784;
      --fail: #ffcdd2;
    }
    html, body {
      margin: 0; padding: 0; height:100%;
      font-family: 'Outfit', sans-serif;
      background: var(--main-grad);
      color: #04555c;
      min-height: 100vh;
    }
    header {
      text-align:center;
      padding:2.3em 1em 1em 1em;
      background: linear-gradient(100deg,#e0f7fa 77%,#faf5ef 100%);
      border-bottom:2px solid #b2ebf2;
      box-shadow:0 2px 26px #e0f7fa15;
    }
    header h1 {
      font-size:2.2em;font-weight:900;letter-spacing:.03em;color:#006064;
      margin-bottom:.2em;
    }
    header p {
      margin:.5em 0 0 0;color:#0097a7;font-size:1.17em;font-weight:500;
    }
    .main-content {
      max-width:470px;margin:2.1em auto 2.5em auto;padding:1.8em 1em 2.6em 1em;
      background:white;border-radius:22px;box-shadow:0 5px 27px #85dde81b;position:relative;
    }

    /* Floating Action Buttons */
    .floating-btn {
      position: fixed;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #18dcff 30%, #4834d4 85%);
      box-shadow: 0 5px 28px #18dcffcc;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 4px solid #00d2ffbb;
      transition: box-shadow 0.25s ease, transform 0.2s ease;
      z-index: 15050;
      user-select: none;
    }
    .floating-btn:active {
      transform: scale(0.9) rotate(-10deg);
      box-shadow: 0 7px 30px #00d2ffdd;
      outline: none;
    }
    .floating-btn:hover,
    .floating-btn:focus-visible {
      box-shadow: 0 12px 46px #18dcffee;
      outline: none;
    }
    .floating-btn img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.3s ease;
    }
    .home {
      top: 30px;
      right: 30px;
    }
    
    .lumipet {
      top: 90px;
      right: 30px;
    }
    .chatbot {
      top: 150px;
      right: 30px;
    }
    /* ====== Integrated Tracker Cards Styles ====== */
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      padding: 1.8rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin-bottom: 1.8rem;
      user-select: none;
    }
    .card h2 {
      font-size: 1.7rem;
      margin-bottom: 0.4rem;
      user-select: none;
      color: #004d40;
    }
    /* Water Tracker droplet style */
    .droplet {
      position: relative;
      background: #b2ebf2;
      width: 80px;
      height: 130px;
      margin: 0 auto 0.8rem;
      border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      box-shadow: inset 0 10px 15px #81d4fa88;
      overflow: hidden;
    }
    .droplet .fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #00bcd4 0%, #00796b 100%);
      border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      transition: height 0.5s ease-in-out;
      box-shadow: inset 0 -5px 10px #004d40cc;
    }
    /* Water count */
    #waterCount {
      font-weight: 700;
      font-size: 1.2rem;
      color: #00695c;
      margin-bottom: 0.6rem;
    }
    /* Buttons */
    button {
      padding: 0.5rem 1rem;
      background-color: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: background-color 0.25s ease;
      user-select: none;
      margin-top: 0.3rem;
    }
    button:hover:not(:disabled) {
      background-color: #007c91;
    }
    button:disabled {
      background-color: #81d4faaa;
      cursor: not-allowed;
    }
    /* Progress bars */
    .progress-bar {
      width: 100%;
      background: #b2ebf2;
      height: 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px #4db6acaa;
      margin-top: 0.4rem;
      user-select: none;
    }
    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #004d40);
      transition: width 0.5s ease-in-out;
      border-radius: 12px 0 0 12px;
    }
    input[type="number"] {
      padding: 0.5rem 0.8rem;
      font-size: 1rem;
      border: 2px solid var(--accent);
      border-radius: 10px;
      width: 100%;
      box-sizing: border-box;
      color: #004d40;
      outline-offset: 2px;
      transition: border-color 0.25s ease;
    }
    input[type="number"]:focus {
      border-color: #007c91;
    }
    .label-progress {
      font-weight: 600;
      margin-top: 0.3rem;
      font-size: 1.1rem;
      user-select: none;
      color: #004d40;
    }
    /* Gratitude inputs and button from original */
    .gratitude-entry {
      margin: 1.4em 0 .6em 0;
      display: flex;
      gap: .7em;
      align-items: center;
    }
    .gratitude-input {
      flex: 1;
      padding: .77em 1em;
      border-radius: 12px;
      border: 1.5px solid #ffe0b2;
      font-size: 1em;
      background: #fffdf7;
      transition: border .18s;
      margin-right: .6em;
    }
    .gratitude-input:focus {
      border-color: var(--grat);
    }
    .grat-btn {
      background: var(--grat);
      color: #fff;
      border: none;
      font-size: 1.1em;
      border-radius: 10px;
      font-weight: 600;
      padding: .5em 1.25em;
      cursor: pointer;
      box-shadow: 0 1px 5px #ffcdd294;
      transition: background .13s;
    }
    .grat-btn:active {
      background: #fff1e2;
      color: #ff7026;
    }
    /* Shake animation for completed */
    @keyframes shake {
      0% {transform:rotate(-9deg);}
      22% {transform:rotate(6deg);}
      39% {transform:rotate(-11deg);}
      65% {transform:rotate(9deg);}
      70% {transform:rotate(0);}
      100% {transform:rotate(0);}
    }
    .habit-row.completed .habit-icon { animation: shake .47s; }

    /* Reward and confetti */
    .reward {
      text-align:center;margin:2em 0 2.6em 0;
      font-size:1.27em;color:#00bfae;opacity:0;transition:opacity .4s;
      animation:rewardPop .87s forwards;
    }
    .reward.show { opacity:1;}
    @keyframes rewardPop {
      0%{opacity:0;transform:scale(0.7);}
      74%{ opacity:1; transform:scale(1.08);}
      100%{ opacity:1; transform:scale(1);}
    }
    .confetti {
      display:none;position:fixed;top:15vh;left:50vw;transform:translateX(-50%);
      z-index:44;font-size:2.3em;pointer-events:none;animation:confettiFloat 1.1s forwards;
    }
    @keyframes confettiFloat {
      0%{transform:translate(-50%, 0);opacity:0;}
      26%{opacity:1;}
      80%{opacity:1;}
      100%{transform:translate(-50%, -90px);opacity:0;}
    }
    /* Summary & motivation */
    .summary-section {
      background:linear-gradient(90deg,#e0f7fa 85%,#faf7ed 100%);
      border-radius:17px;padding:1.3em 1em 1.3em 1em;text-align:center;
      color:#006664;margin-top:2.5em;margin-bottom:1.1em;
      box-shadow:0 1px 8px #d6e7ea27;
    }
    .chart-section {margin-top:2em;}
    .summary-badge {
      font-size:1.9em;padding-right:0.3em;vertical-align:middle;
      color:var(--success);filter:drop-shadow(0 1px 7px #bae7ce44);
    }
    .motiv-text {
      font-size:1.07em;padding-top:.8em;color:#738488;
      letter-spacing:.01em;font-weight:500;
    }
    @media (max-width:570px) {
      .main-content{padding:.8em 0.1em 1.1em 0.1em;}
      header {padding:1.3em .13em;}
      .card { max-width: 100%; }
    }
      footer {
      background: #2d3436;
      color: #fff;
      text-align: center;
      padding: 1.2rem;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌱 Healthy Habit Tracker</h1>
    <p>Build consistency. Earn rewards. See your growth!</p>
  </header>
  <div class="main-content" id="habitApp">
      <!-- Floating LumiPet and Chatbot Buttons -->
  <button class="floating-btn home" id="home" aria-label="Floating Home button" onclick="location.href='home.html'">
    <img src="image/logo.jpg" alt="logo" />
  </button>

  <button class="floating-btn lumipet" id="lumipet" aria-label="Floating LumiPet virtual companion" onclick="location.href='pet.html'">
    <img src="https://cdn-icons-png.flaticon.com/256/10872/10872585.png" alt="LumiPet companion icon" />
  </button>

  <button class="floating-btn chatbot" id="chatbot" aria-label="Floating chatbot virtual companion" onclick="location.href='chatbot.html'">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712038.png" alt="LumiBot chatbot icon" />
  </button>
    <!-- Integrated Water Intake card -->
    <div class="card" aria-label="Water Intake Tracker">
      <h2>💧 Water Intake</h2>
      <div class="droplet" role="img" aria-label="Water level">
        <div class="fill" id="waterFill" style="height: 0%"></div>
      </div>
      <p><span id="waterCount">0</span>/8 glasses</p>
      <button id="waterBtn" onclick="incrementWater()">Add Glass</button>
    </div>

    <!-- Integrated Sleep Tracker card -->
    <div class="card" aria-label="Sleep Tracker">
      <h2>😴 Sleep</h2>
      <input type="number" id="sleepInput" min="0" max="24" placeholder="Hours slept last night" aria-label="Input hours slept last night" />
      <div class="progress-bar" aria-label="Sleep progress">
        <div class="progress" id="sleepProgress"></div>
      </div>
      <p class="label-progress" id="sleepLabel">0 / 8 hours</p>
      <button onclick="trackSleep()">Track Sleep</button>
    </div>

    <!-- Integrated Movement Tracker card -->
    <div class="card" aria-label="Movement Tracker">
      <h2>🏃 Movement</h2>
      <input type="number" id="moveInput" min="0" max="24" step="0.1" placeholder="Hours moved today" aria-label="Input hours moved today" />
      <div class="progress-bar" aria-label="Movement progress">
        <div class="progress" id="moveProgress"></div>
      </div>
      <p class="label-progress" id="moveLabel">0 / 45 mins</p>
      <button onclick="trackMovement()">Track Movement</button>
    </div>

    <!-- Gratitude Entry -->
    <div class="gratitude-entry">
      <input class="gratitude-input" id="gratInput" placeholder="One thing I'm grateful for today..." />
      <button class="grat-btn" onclick="addGratitude()">Add Gratitude</button>
    </div>
    <div id="gratShow" style="font-size:1em;padding:.2em 0 .8em .2em;color:#fc8768;"></div>

    <!-- Completion/Reward -->
    <div class="reward" id="dailyReward"></div>
    <div class="confetti" id="confetti">🎉✨🏅</div>

    <!-- Weekly Analytics and Motivation -->
    <div class="summary-section" id="motivSummary">
      <span class="summary-badge" id="motBadge">🏅</span>
      <span id="weekSummaryText">Keep tracking your habits to unlock weekly insights!</span>
      <div class="motiv-text" id="motivation"></div>
    </div>
    <section class="chart-section">
      <canvas id="analyticsChart" height="145"></canvas>
    </section>
  </div>
   <footer>
    Designed and Developed by ANUSHKA VIDYARTHY 😊
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Habit tracker initial data
    let habits = [
      {name:'Water Intake', key:'water', icon:'💧', goal:8, unit:'glasses', color:'water', value:0},
      {name:'Sleep', key:'sleep', icon:'😴', goal:8, unit:'hours', color:'sleep', value:0},
      {name:'Movement', key:'move', icon:'🏃‍♂️', goal:30, unit:'mins', color:'move', value:0},
      {name:'Gratitude', key:'grat', icon:'🙏', goal:1, unit:'entry', color:'grat', value:0},
    ];
    let gratitudes = [];

    // ----- Water Intake Logic -----
    const waterFill = document.getElementById('waterFill');
    const waterCountDisplay = document.getElementById('waterCount');
    const waterBtn = document.getElementById('waterBtn');
    const waterGoal = 8;

    function incrementWater() {
      if(habits[0].value < waterGoal) {
        habits[0].value++;
        updateWaterUI();
        renderHabits();
        checkRewards();
        renderAnalytics();
      }
      if(habits[0].value >= waterGoal) {
        waterBtn.disabled = true;
        waterBtn.textContent = "Goal Reached!";
      }
    }

    function updateWaterUI() {
      const fillPercent = (habits[0].value / waterGoal) * 100;
      waterFill.style.height = fillPercent + '%';
      waterCountDisplay.textContent = habits[0].value;
    }

    // ----- Sleep Logic -----
    const sleepInput = document.getElementById('sleepInput');
    const sleepProgress = document.getElementById('sleepProgress');
    const sleepLabel = document.getElementById('sleepLabel');
    const sleepGoal = 8;

    function trackSleep() {
      let val = parseFloat(sleepInput.value);
      if (isNaN(val) || val < 0) {
        alert('Please enter a valid number of hours slept.');
        return;
      }
      habits[1].value = val;
      let percent = Math.min((val / sleepGoal) * 100, 100);
      sleepProgress.style.width = percent + '%';
      sleepLabel.textContent = `${val} / ${sleepGoal} hours`;
      renderHabits();
      checkRewards();
      renderAnalytics();
    }

    // ----- Movement Logic -----
    const moveInput = document.getElementById('moveInput');
    const moveProgress = document.getElementById('moveProgress');
    const moveLabel = document.getElementById('moveLabel');
    const moveGoalMins = 30;

    function trackMovement() {
      let val = parseFloat(moveInput.value);
      if (isNaN(val) || val < 0) {
        alert('Please enter a valid number of minutes moved.');
        return;
      }
      habits[2].value = val;
      let percent = Math.min((val / moveGoalMins) * 100, 100);
      moveProgress.style.width = percent + '%';
      moveLabel.textContent = `${val} / ${moveGoalMins} mins`;
      renderHabits();
      checkRewards();
      renderAnalytics();
    }

    // Rendering habits progress (for icon animations)
    function renderHabits() {
      const habitRows = document.querySelectorAll('.habit-row');
      habitRows.forEach(row => row.remove()); // Clear old animations if any

      // We visually update check icons here if desired - omitted since using cards.
      // You can expand this function for more habit feedback animations if you add habit rows.
    }

    // ----- Gratitude Entrys -----
    function addGratitude() {
      let txt = document.getElementById('gratInput').value.trim();
      if(!txt) return;
      gratitudes.push(txt);
      document.getElementById('gratShow').innerText = '📝 ' + txt;
      document.getElementById('gratInput').value = '';
      habits[3].value = 1; // Mark gratitude done
      renderHabits();
      checkRewards();
      renderAnalytics();
    }

    // ----- Daily Rewards -----
    function checkRewards() {
      // All habits completed & at goal
      if (habits[0].value >= waterGoal && habits[1].value >= sleepGoal && habits[2].value >= moveGoalMins && habits[3].value >= 1) {
        const r = document.getElementById('dailyReward');
        r.innerHTML = "You completed all healthy habits today! 🌟<br><span style='font-size:1.4em'>Great work!</span>";
        r.classList.add('show');
        triggerConfetti();
      }
    }
    function triggerConfetti() {
      const c = document.getElementById('confetti');
      c.style.display = "block";
      setTimeout(() => { c.style.display = "none"; }, 1100);
    }

    // ------- Weekly Analytics & Motivation ---------
    // Simulated week data for demo
    const weekData = [
      {d:'Mon', water:7, sleep:7.5, move:25, grat:1},
      {d:'Tue', water:8, sleep:8, move:33, grat:1},
      {d:'Wed', water:6, sleep:7, move:20, grat:1},
      {d:'Thu', water:8, sleep:8.5, move:34, grat:1},
      {d:'Fri', water:5, sleep:6.5, move:15, grat:1},
      {d:'Sat', water:7, sleep:8, move:30, grat:1},
      {d:'Sun', water:8, sleep:7, move:40, grat:1}
    ];
    function renderAnalytics() {
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      if(window.chartRef) window.chartRef.destroy();

      window.chartRef = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: weekData.map(d=>d.d),
          datasets: [
            {label:'Water', data:weekData.map(d=>d.water),backgroundColor:'#4bcffa',stack:"h"},
            {label:'Sleep', data:weekData.map(d=>d.sleep),backgroundColor:'#8e99f3',stack:"h"},
            {label:'Movement', data:weekData.map(d=>d.move),backgroundColor:'#f9c846',stack:"h"},
          ]
        },
        options: {
          responsive:true, plugins:{legend:{position:'top'},},
          scales: {x:{stacked:true,max:50},y:{stacked:true}},
        }
      });
      let goodDays = weekData.filter(day => day.water>=8 && day.sleep>=8 && day.move>=30).length;
      document.getElementById('motBadge').textContent = goodDays >= 5 ? "🏆" : "🌱";
      document.getElementById('weekSummaryText').innerHTML = `This week: <b>${goodDays}</b> days of ALL habits met.<br>`;
      const motArr = [
        "Keep going! Small daily wins lead to big change! 💡",
        "Celebrate every step. Tomorrow’s a new chance. 🎯",
        "You’re building powerful habits – keep showing up! 🌟",
        "Consistency over perfection is what counts.",
        "Look how far you've come. Be proud! 🙌"
      ];
      document.getElementById('motivation').innerText = motArr[Math.floor(Math.random()*motArr.length)];
    }

    // Initialize UI with zero data
    updateWaterUI();
    sleepLabel.textContent = `0 / 8 hours`;
    moveLabel.textContent = `0 / 30 mins`;
    renderAnalytics();
  </script>
</body>
</html>
